<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · Underwater Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#eef4f3;color:#173d43}.card{max-width:620px;margin:8vh auto;border:0;border-radius:20px;box-shadow:0 12px 36px #153a4420}.btn-primary{background:#075965;border-color:#075965}</style>
</head><body><main class="card p-4 p-md-5">
  <a href="{{ url_for('dashboard') }}" class="text-decoration-none">← Dashboard</a>
  <h1 class="h3 mt-3">My profile</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
  <form method="post" class="mt-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" maxlength="100" required value="{{ user_name }}">
    <label class="form-label" for="email">Email</label><input class="form-control mb-4" id="email" name="email" type="email" maxlength="255" required value="{{ user_email }}">
    <button class="btn btn-primary">Save profile</button>
  </form>
</main></body></html>
