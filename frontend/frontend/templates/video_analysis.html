<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Analysis · Underwater Detection</title><meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#edf4f3;color:#173d43}.container{max-width:1000px;padding-top:4vh}.card{border:0;border-radius:20px;box-shadow:0 10px 32px #153a4418}.btn-primary{background:#075965;border-color:#075965}video{max-height:65vh;background:#102c31;border-radius:12px}</style>
</head><body><main class="container pb-5">
  <a href="{{ url_for('dashboard') }}" class="text-decoration-none">← Dashboard</a><h1 class="h3 mt-3">Underwater video analysis</h1>
  <p class="text-secondary">Upload an MP4, AVI, MOV, or MKV. Detection samples about one frame per second; counts are detections across sampled frames, not guaranteed unique objects.</p>
  <section class="card p-4"><form id="videoForm"><label for="videoFile" class="form-label">Choose a video (up to 50 MB)</label><input class="form-control" id="videoFile" name="file" type="file" accept="video/mp4,video/x-msvideo,video/quicktime,video/x-matroska" required><button class="btn btn-primary mt-3" id="submitButton">Analyze video</button></form><div id="status" class="mt-3" role="status"></div><div id="result" class="mt-4" hidden><video id="annotatedVideo" controls class="w-100"></video><h2 class="h5 mt-3">Sampled detections by class</h2><ul id="summary"></ul><div id="trackingNote" class="small text-secondary"></div></div></section>
</main><script>
const form=document.getElementById('videoForm'),statusEl=document.getElementById('status'),button=document.getElementById('submitButton');
form.addEventListener('submit',async(event)=>{event.preventDefault();const file=document.getElementById('videoFile').files[0];if(!file)return;button.disabled=true;statusEl.textContent='Processing video. Keep this page open.';statusEl.className='mt-3 text-primary';try{const body=new FormData(form);const response=await fetch('{{ url_for("predict_video") }}',{method:'POST',headers:{'X-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},body,credentials:'same-origin'});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'Video analysis failed.');document.getElementById('annotatedVideo').src=data.video_url;const list=document.getElementById('summary');list.replaceChildren();for(const item of data.summary){const li=document.createElement('li');li.textContent=`${item.class_name}: ${item.count}`;list.appendChild(li);}document.getElementById('trackingNote').textContent=data.tracking_note;document.getElementById('result').hidden=false;statusEl.textContent=`Processed ${data.processed_frames} frames; inference sampled at about one frame per second.`;statusEl.className='mt-3 text-success';}catch(error){statusEl.textContent=error.message;statusEl.className='mt-3 text-danger';}finally{button.disabled=false;}});
</script></body></html>
